<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI Brightness Tracker</title>
<style>
  :root {
    --bg: #1b1b1d;
    --bg-alt: #232326;
    --line: #38383c;
    --text: #ede8de;
    --text-dim: #a8a39a;
    --accent: #6e8f71;
    --font-body: "Work Sans", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }
  .app {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    padding: 1.25rem;
  }
  .pane {
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1rem;
  }
  .video-pane { flex: 1 1 420px; min-width: 320px; }
  .plot-pane { flex: 1 1 420px; min-width: 320px; display: flex; flex-direction: column; }

  .video-wrap {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  video { width: 100%; display: block; }
  canvas.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.5rem 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button:hover:not(:disabled) {
    border-color: var(--accent);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.6rem;
  }
  .status strong { color: var(--accent); }

  .plot-wrap { flex: 1; position: relative; min-height: 260px; }
  #chart {
    display: block;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.12);
    border-radius: 4px;
  }

  .hint {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }
</style>
</head>
<body>

<div class="app">
  <div class="pane video-pane">
    <div class="video-wrap">
      <video id="video" playsinline src="/assets/videos/research/learning.mp4"></video>
      <canvas class="overlay" id="overlay"></canvas>
    </div>
    <div class="row">
      <button id="playBtn" disabled>play</button>
      <button id="clearRectBtn" disabled>clear rectangle</button>
      <button id="clearPlotBtn" disabled>clear plot</button>
      <button id="exportBtn" disabled>export csv</button>
    </div>
    <p class="status" id="status">Loading video&hellip;</p>
    <p class="hint">Click and drag on the video to set the sampling rectangle. You can redraw it any time, including while the video plays.</p>
  </div>

  <div class="pane plot-pane">
    <div class="plot-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  video.loop = true;
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');
  const plotCanvas = document.getElementById('chart');
  const pctx = plotCanvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const clearRectBtn = document.getElementById('clearRectBtn');
  const clearPlotBtn = document.getElementById('clearPlotBtn');
  const exportBtn = document.getElementById('exportBtn');
  const statusEl = document.getElementById('status');

  const sampleCanvas = document.createElement('canvas');
  const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });

  let rect = null;
  let dragStart = null;
  let dragging = false;
  let data = [];
  let previousTime = 0;

  function setStatus(msg) { statusEl.innerHTML = msg; }

  function resizeOverlay() {
    const box = video.getBoundingClientRect();
    overlay.width = box.width;
    overlay.height = box.height;
    drawOverlay();
  }

  function displayRectFromNative() {
    if (!rect || !video.videoWidth) return null;
    const scaleX = overlay.width / video.videoWidth;
    const scaleY = overlay.height / video.videoHeight;
    return {
      x: rect.x * scaleX,
      y: rect.y * scaleY,
      w: rect.w * scaleX,
      h: rect.h * scaleY,
    };
  }

  function drawOverlay(previewDisplayRect) {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    const r = previewDisplayRect || displayRectFromNative();
    if (!r) return;
    octx.strokeStyle = '#6e8f71';
    octx.lineWidth = 2;
    octx.strokeRect(r.x, r.y, r.w, r.h);
    octx.fillStyle = 'rgba(110,143,113,0.15)';
    octx.fillRect(r.x, r.y, r.w, r.h);
  }

  function drawPlot() {
    const rect = plotCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(260, Math.floor(rect.width));
    const h = Math.max(220, Math.floor(rect.height));
    plotCanvas.width = w * dpr;
    plotCanvas.height = h * dpr;
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, w, h);

    pctx.strokeStyle = '#38383c';
    pctx.lineWidth = 1;
    pctx.beginPath();
    const leftPad = 58;
    const rightPad = 18;
    const topPad = 20;
    const bottomPad = 38;
    const chartW = w - leftPad - rightPad;
    const chartH = h - topPad - bottomPad;
    const maxX = 8;
    const maxY = 127.5;

    pctx.moveTo(leftPad, topPad);
    pctx.lineTo(leftPad, h - bottomPad);
    pctx.lineTo(w - rightPad, h - bottomPad);
    pctx.stroke();

    pctx.fillStyle = '#a8a39a';
    pctx.font = '11px "IBM Plex Mono", monospace';
    pctx.textAlign = 'center';
    [0, 2, 4, 6, 8].forEach((tick) => {
      const x = leftPad + (tick / maxX) * chartW;
      pctx.beginPath();
      pctx.moveTo(x, topPad);
      pctx.lineTo(x, h - bottomPad);
      pctx.stroke();
      pctx.fillText(tick + 's', x, h - 12);
    });

    pctx.textAlign = 'right';
    [0, 64, 127.5].forEach((tick) => {
      const y = topPad + ((maxY - tick) / maxY) * chartH;
      pctx.beginPath();
      pctx.moveTo(leftPad, y);
      pctx.lineTo(w - rightPad, y);
      pctx.stroke();
      pctx.fillText(String(Math.round(tick)), leftPad - 6, y + 4);
    });

    pctx.save();
    pctx.translate(14, topPad + chartH / 2);
    pctx.rotate(-Math.PI / 2);
    pctx.textAlign = 'center';
    pctx.fillText('Fluorescenece (GCaMP signal)', 0, 0);
    pctx.restore();

    if (!data.length) return;

    pctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const point = data[i];
      const x = leftPad + ((point.x / maxX) * chartW);
      const y = topPad + ((maxY - point.y) / maxY) * chartH;
      if (i === 0) pctx.moveTo(x, y);
      else pctx.lineTo(x, y);
    }
    pctx.strokeStyle = '#6e8f71';
    pctx.lineWidth = 2;
    pctx.stroke();

    pctx.fillStyle = 'rgba(110,143,113,0.18)';
    pctx.lineTo(leftPad + chartW, h - bottomPad);
    pctx.lineTo(leftPad, h - bottomPad);
    pctx.closePath();
    pctx.fill();
  }

  function overlayPoint(evt) {
    const box = overlay.getBoundingClientRect();
    const clientX = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    const clientY = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    return { x: clientX - box.left, y: clientY - box.top };
  }

  function startDrag(evt) {
    if (!video.videoWidth) return;
    dragging = true;
    dragStart = overlayPoint(evt);
    evt.preventDefault();
  }

  function moveDrag(evt) {
    if (!dragging) return;
    const p = overlayPoint(evt);
    const x = Math.min(dragStart.x, p.x);
    const y = Math.min(dragStart.y, p.y);
    const w = Math.abs(p.x - dragStart.x);
    const h = Math.abs(p.y - dragStart.y);
    drawOverlay({ x, y, w, h });
    evt.preventDefault();
  }

  function endDrag(evt) {
    if (!dragging) return;
    dragging = false;
    const p = overlayPoint(evt);
    const x = Math.min(dragStart.x, p.x);
    const y = Math.min(dragStart.y, p.y);
    const w = Math.abs(p.x - dragStart.x);
    const h = Math.abs(p.y - dragStart.y);

    if (w < 4 || h < 4) {
      drawOverlay();
      return;
    }

    const scaleX = video.videoWidth / overlay.width;
    const scaleY = video.videoHeight / overlay.height;
    rect = {
      x: Math.round(x * scaleX),
      y: Math.round(y * scaleY),
      w: Math.round(w * scaleX),
      h: Math.round(h * scaleY),
    };
    clearRectBtn.disabled = false;
    setStatus(`Rectangle set: <strong>${rect.w}×${rect.h}px</strong>. Press play to start sampling.`);
    drawOverlay();
  }

  overlay.addEventListener('mousedown', startDrag);
  overlay.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  overlay.addEventListener('touchstart', startDrag, { passive: false });
  overlay.addEventListener('touchmove', moveDrag, { passive: false });
  overlay.addEventListener('touchend', endDrag);

  function meanBrightness() {
    sctx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
    const { x, y, w, h } = rect;
    const clampedW = Math.min(w, sampleCanvas.width - x);
    const clampedH = Math.min(h, sampleCanvas.height - y);
    if (clampedW <= 0 || clampedH <= 0) return null;
    const frame = sctx.getImageData(x, y, clampedW, clampedH).data;
    let sum = 0;
    const n = frame.length / 4;
    for (let i = 0; i < frame.length; i += 4) {
      sum += 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
    }
    return sum / n;
  }

  function resetTrace() {
    data = [];
    drawPlot();
    clearPlotBtn.disabled = true;
    exportBtn.disabled = true;
  }

  function tick() {
    if (rect && !video.paused && !video.ended) {
      const y = meanBrightness();
      if (y !== null) {
        data.push({ x: video.currentTime, y: y });
        drawPlot();
        clearPlotBtn.disabled = false;
        exportBtn.disabled = false;
      }
    }
    requestAnimationFrame(tick);
  }

  video.addEventListener('error', () => {
    setStatus('Could not load <strong>assets/videos/research/learning.mp4</strong>. Check that the file exists at that path relative to this tool.');
  });

  video.addEventListener('loadedmetadata', () => {
    sampleCanvas.width = video.videoWidth;
    sampleCanvas.height = video.videoHeight;
    drawPlot();
    resizeOverlay();
    playBtn.disabled = false;
    setStatus(`Video loaded: <strong>${video.videoWidth}×${video.videoHeight}px</strong>, ${video.duration.toFixed(1)}s. Click and drag on the video to select a region.`);
  });

  window.addEventListener('resize', () => {
    resizeOverlay();
    drawPlot();
  });

  playBtn.addEventListener('click', () => {
    if (video.paused) {
      if (!rect) {
        setStatus('Draw a rectangle on the video first.');
        return;
      }
      video.play();
    } else {
      video.pause();
    }
  });

  video.addEventListener('play', () => { playBtn.textContent = 'pause'; });
  video.addEventListener('pause', () => { playBtn.textContent = 'play'; });
  video.addEventListener('timeupdate', () => {
    if (video.currentTime < previousTime) {
      resetTrace();
    }
    previousTime = video.currentTime;
  });
  video.addEventListener('ended', () => {
    playBtn.textContent = 'play';
    resetTrace();
  });

  clearRectBtn.addEventListener('click', () => {
    rect = null;
    clearRectBtn.disabled = true;
    drawOverlay();
    setStatus('Rectangle cleared. Draw a new one to resume sampling.');
  });

  clearPlotBtn.addEventListener('click', () => {
    resetTrace();
    setStatus('Plot cleared.');
  });

  exportBtn.addEventListener('click', () => {
    let csv = 'time_s,mean_brightness\n';
    data.forEach(d => { csv += `${d.x.toFixed(3)},${d.y.toFixed(3)}\n`; });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'roi-brightness.csv';
    a.click();
  });

  drawPlot();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
