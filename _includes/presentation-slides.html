<section
  class="nematostella-slideshow presentation-show"
  data-presentation-show
  data-slide-prefix="{{ '/research/' | append: page.slide_folder | append: '/' | relative_url }}"
  data-slide-count="{{ page.slide_count }}"
  data-presentation-title="{{ page.title | escape }}"
  aria-label="{{ page.title | escape }} presentation"
  tabindex="0">
  <div class="nematostella-slideshow__stage">
    <img
      data-slide-image
      src="{{ '/research/' | append: page.slide_folder | append: '/Slide1.jpeg' | relative_url }}"
      alt="Slide 1 of {{ page.slide_count }}: {{ page.title | escape }}"
      fetchpriority="high">
  </div>
  <div class="nematostella-slideshow__controls">
    <button type="button" data-slide-previous aria-label="Previous slide">&larr;</button>
    <span data-slide-counter aria-live="polite" aria-atomic="true">Slide 1 of {{ page.slide_count }}</span>
    <button type="button" data-slide-next aria-label="Next slide">&rarr;</button>
  </div>
  <p class="nematostella-slideshow__hint">Use the left and right arrow keys or the buttons to navigate.</p>
</section>

<script>
  (() => {
    const slideshow = document.querySelector("[data-presentation-show]");
    if (!slideshow) return;

    const prefix = slideshow.dataset.slidePrefix;
    const title = slideshow.dataset.presentationTitle;
    const slideCount = Number(slideshow.dataset.slideCount);
    const image = slideshow.querySelector("[data-slide-image]");
    const counter = slideshow.querySelector("[data-slide-counter]");
    const previousButton = slideshow.querySelector("[data-slide-previous]");
    const nextButton = slideshow.querySelector("[data-slide-next]");
    let currentSlide = 0;

    const showSlide = (index) => {
      currentSlide = (index + slideCount) % slideCount;
      image.src = `${prefix}Slide${currentSlide + 1}.jpeg`;
      image.alt = `Slide ${currentSlide + 1} of ${slideCount}: ${title}`;
      counter.textContent = `Slide ${currentSlide + 1} of ${slideCount}`;
    };

    previousButton.addEventListener("click", () => showSlide(currentSlide - 1));
    nextButton.addEventListener("click", () => showSlide(currentSlide + 1));
    slideshow.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        showSlide(currentSlide - 1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        showSlide(currentSlide + 1);
      }
    });
  })();
</script>
